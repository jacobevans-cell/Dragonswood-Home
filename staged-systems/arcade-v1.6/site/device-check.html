<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a251f"><title>Dragonswood Arcade • Device Check</title><link rel="icon" href="assets/dragonswood-arcade-crest.svg"><style>
:root{color-scheme:dark;--bg:#06110e;--panel:#0d251e;--line:#315146;--gold:#f1d171;--ok:#73e0a8;--warn:#ffd36d;--bad:#ff8e83;--muted:#aec1ba}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#254839,transparent 38%),var(--bg);color:#f5f8e8;font:15px system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(900px,calc(100% - 28px));margin:0 auto;padding:32px 0 60px}.top{display:flex;gap:14px;align-items:center}.top img{width:64px}.top h1{font:800 36px Georgia,serif;margin:0;color:#fff0a8}.top p{margin:5px 0;color:var(--muted)}.summary{margin:22px 0;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel);display:flex;justify-content:space-between;gap:18px;align-items:center}.summary strong{font-size:22px}.pill{padding:8px 12px;border-radius:999px;font-weight:900}.pill.ok{background:#163e2d;color:var(--ok)}.pill.warn{background:#42351c;color:var(--warn)}.pill.bad{background:#47231f;color:var(--bad)}#checks{display:grid;gap:10px}.check{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:14px;background:#0a1e18}.check .mark{font-size:22px}.check h2{font-size:15px;margin:0 0 3px}.check p{font-size:12px;color:var(--muted);margin:0;line-height:1.45}.check .state{font-size:11px;font-weight:950;letter-spacing:.08em}.check.ok .state{color:var(--ok)}.check.warn .state{color:var(--warn)}.check.bad .state{color:var(--bad)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions button,.actions a{border:0;border-radius:11px;padding:12px 15px;font-weight:900;text-decoration:none;cursor:pointer;background:var(--gold);color:#14251f}.actions .secondary{background:#17352c;color:#e8f2eb;border:1px solid var(--line)}.details{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#081914;color:var(--muted);font:12px ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}@media(max-width:600px){.summary{align-items:flex-start;flex-direction:column}.check{grid-template-columns:30px 1fr}.check .state{grid-column:2}}
</style></head><body><main><div class="top"><img src="assets/dragonswood-arcade-crest.svg" alt=""><div><h1>Device Check</h1><p>Run this once on a real student Chromebook before class rollout.</p></div></div><div class="summary"><div><strong id="headline">Checking this device…</strong><div id="subline" style="color:var(--muted);margin-top:4px">Nothing here changes student data or rewards.</div></div><span id="overall" class="pill warn">CHECKING</span></div><div id="checks"></div><div class="actions"><button id="rerun">Run again</button><button id="prime" class="secondary">Prime offline cache</button><a class="secondary" href="index.html">Return to Arcade</a></div><pre id="details" class="details"></pre></main><script>
const CRITICAL=[['Local Three.js','games/void-runner/vendor/three.module.js'],['Three.js core','games/void-runner/vendor/three.core.js'],['Void Runner','games/void-runner/js/game.js'],['Dragon Dash','games/dragon-dash/game.js']];
const host=document.querySelector('#checks'),details=document.querySelector('#details');let results=[];
function add(name,state,text){results.push({name,state,text});const d=document.createElement('div');d.className='check '+state;d.innerHTML=`<div class="mark">${state==='ok'?'✓':state==='warn'?'!':'×'}</div><div><h2>${name}</h2><p>${text}</p></div><div class="state">${state.toUpperCase()}</div>`;host.appendChild(d)}
async function exists(url){try{const r=await fetch(url,{cache:'no-store'});return r.ok}catch{return false}}
async function run(){host.innerHTML='';results=[];document.querySelector('#overall').textContent='CHECKING';
 const mem=Number(navigator.deviceMemory||0),cores=Number(navigator.hardwareConcurrency||0);add('Hardware hint',(mem&&mem<=4)||(cores&&cores<=4)?'warn':'ok',`${mem?mem+' GB reported memory':'Memory detail unavailable'} • ${cores||'?'} logical cores. Auto mode will choose Chromebook Low on 4 GB / 4-core-class hardware.`);
 let gl=null;try{const c=document.createElement('canvas');gl=c.getContext('webgl2',{failIfMajorPerformanceCaveat:false})||c.getContext('webgl',{failIfMajorPerformanceCaveat:false})}catch{}add('WebGL',gl?'ok':'bad',gl?'3D graphics context opened successfully.':'WebGL is unavailable or blocked. Void Runner will not start; Dragon Dash will still work.');
 try{localStorage.setItem('__dw_test','1');localStorage.removeItem('__dw_test');add('Local storage','ok','Student settings and offline progress can be stored on this device.')}catch(e){add('Local storage','bad','Browser policy blocked local storage. Standalone progress will not persist.')}
 for(const [name,url] of CRITICAL){const ok=await exists(url);add(name,ok?'ok':(name.includes('Three')?'bad':'warn'),ok?`${url} is served locally.`:`${url} was not found on this deployment.`)}
 if('serviceWorker' in navigator){try{const reg=await navigator.serviceWorker.getRegistration();add('Service worker',reg?'ok':'warn',reg?'Arcade offline worker is registered.':'Not registered yet. Open the Arcade once online, then prime the cache.')}catch{add('Service worker','warn','Service worker status could not be read.')}}else add('Service worker','bad','This browser does not support service workers.');
 if('caches' in window){let cached=0;for(const [,u] of CRITICAL){if(await caches.match(u))cached++}add('Offline critical files',cached===CRITICAL.length?'ok':'warn',`${cached}/${CRITICAL.length} critical game files are currently available from Cache Storage.`)}else add('Offline critical files','warn','Cache Storage API unavailable.');
 add('Network',navigator.onLine?'ok':'warn',navigator.onLine?'Browser reports an active network connection.':'Browser reports offline. This is okay only after the arcade has been cached.');
 const bad=results.filter(x=>x.state==='bad').length,warn=results.filter(x=>x.state==='warn').length,overall=document.querySelector('#overall');overall.className='pill '+(bad?'bad':warn?'warn':'ok');overall.textContent=bad?'NOT READY':warn?'READY WITH WARNINGS':'ROLLOUT READY';document.querySelector('#headline').textContent=bad?'Fix the red checks before class.':warn?'Core launch works; review the warnings.':'This Chromebook passed the rollout checks.';details.textContent=`User agent: ${navigator.userAgent}\nScreen: ${screen.width}×${screen.height} @ ${devicePixelRatio||1}x\nMemory hint: ${mem||'unavailable'} GB\nCPU hint: ${cores||'unavailable'} cores\nOnline: ${navigator.onLine}\nTime: ${new Date().toISOString()}`;}
document.querySelector('#rerun').onclick=run;document.querySelector('#prime').onclick=async()=>{if(!('serviceWorker'in navigator)){alert('Service workers are unavailable on this browser.');return}try{await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;alert('Offline cache primed. Reload this page, then run the checks again.')}catch(e){alert('Could not prime the offline cache: '+e.message)}};run();
</script></body></html>
