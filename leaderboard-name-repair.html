<!-- Dragonswood Leaderboard Repair -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragonswood Leaderboard Repair</title><link rel="icon" type="image/png" href="v33-integration/assets/branding/dragonswood-mascot-crest.png">

<style>
body{
  margin:0;
  background:#070616;
  color:#fff8e9;
  font-family:Arial;
  padding:30px;
}
main{
  max-width:800px;
  margin:auto;
  background:#0d0925;
  border:1px solid #f4c95d;
  border-radius:14px;
  padding:24px;
}
h1{
  font-family:Georgia;
  color:#ffe8a0;
}
.ok{color:#8ff0b6}
.bad{color:#ff9db5}
button{
  padding:12px 18px;
  border:1px solid #f4c95d;
  border-radius:8px;
  color:white;
  font-weight:900;
  background:linear-gradient(90deg,#652dc1,#08789e);
  cursor:pointer;
}
button:disabled{
  opacity:.45;
  cursor:not-allowed;
}
pre{
  white-space:pre-wrap;
  background:#050411;
  padding:14px;
  border-radius:8px;
  min-height:90px;
}
</style>
<link rel="stylesheet" href="v33-integration/css/direct-visual-v11.css?v=1.1"></head>

<body>

<main>

<h1>🐉 Dragonswood Leaderboard Name Repair</h1>

<p>
This teacher-only utility repairs OLD score records that say “Player”
by matching each score's studentId to the student's Dragonswood profile.
</p>

<div id="status">Opening the Hall of Records…</div>

<p>
<button id="repair" disabled>
REPAIR OLD LEADERBOARD NAMES
</button>
</p>

<pre id="log"></pre>

</main>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyC918WJoGQgxRKsqcz-3bXI7iZWv_1bwYE",
  authDomain: "dragonswood-9289e.firebaseapp.com",
  projectId: "dragonswood-9289e",
  storageBucket: "dragonswood-9289e.firebasestorage.app",
  messagingSenderId: "1064477064695",
  appId: "1:1064477064695:web:283e1016ee2303d39042f2",
  measurementId: "G-LPRLDGVBD2"
};

const TEACHER = "jacobicusjax@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const st = document.getElementById("status");
const btn = document.getElementById("repair");
const log = document.getElementById("log");

let user = null;

onAuthStateChanged(auth, u => {

  user = u;

  if(!u){
    st.textContent =
      "Sign into Dragonswood with the teacher account first.";
    st.className = "bad";
    btn.disabled = true;
    return;
  }

  if((u.email || "").toLowerCase() !== TEACHER){
    st.textContent =
      "Teacher account required. Currently signed in as: " +
      (u.email || "unknown");
    st.className = "bad";
    btn.disabled = true;
    return;
  }

  st.textContent =
    "✓ Teacher connected: " + u.email;

  st.className = "ok";
  btn.disabled = false;
});


btn.onclick = async () => {

  btn.disabled = true;
  log.textContent = "Reading students and scores…\n";

  try {

    const [studentSnap, scoreSnap] = await Promise.all([
      getDocs(collection(db,"students")),
      getDocs(collection(db,"scores"))
    ]);

    const names = new Map();

    studentSnap.docs.forEach(d => {
      const s = d.data();

      const name =
        s.firstName ||
        s.displayName ||
        s.playerName ||
        "";

      if(name){
        names.set(d.id, name);
      }
    });

    let changed = 0;
    let skipped = 0;

    let batch = writeBatch(db);
    let ops = 0;
    const commits = [];

    for(const d of scoreSnap.docs){

      const s = d.data();

      const current =
        s.displayName ||
        s.playerName ||
        "";

      if(
        current &&
        current.trim() &&
        current.trim().toLowerCase() !== "player"
      ){
        skipped++;
        continue;
      }

      const studentId =
        s.studentId ||
        s.uid ||
        s.userId ||
        "";

      if(!studentId){
        log.textContent +=
          `Skipped ${d.id}: no studentId\n`;
        skipped++;
        continue;
      }

      const name = names.get(studentId);

      if(!name){
        log.textContent +=
          `Skipped ${d.id}: no matching student profile\n`;
        skipped++;
        continue;
      }

      batch.update(d.ref,{
        displayName:name,
        playerName:name,
        nameRepairedAt:serverTimestamp()
      });

      changed++;
      ops++;

      if(ops >= 400){
        commits.push(batch.commit());
        batch = writeBatch(db);
        ops = 0;
      }
    }

    if(ops > 0){
      commits.push(batch.commit());
    }

    await Promise.all(commits);

    log.textContent +=
      "\nREPAIR COMPLETE\n\n";

    log.textContent +=
      `Updated: ${changed}\n`;

    log.textContent +=
      `Already OK / skipped: ${skipped}\n\n`;

    log.textContent +=
      changed
        ? "Old leaderboard records now use the student's Dragonswood name."
        : "No leaderboard records needed repair.";

    st.textContent =
      "✓ Leaderboard repair finished.";

    st.className = "ok";

  } catch(err){

    console.error(err);

    st.textContent =
      "Repair failed.";

    st.className = "bad";

    log.textContent +=
      "\nERROR: " +
      (err?.code || "unknown") +
      " — " +
      (err?.message || String(err));
  }

  btn.disabled = false;
};

</script>

</body>
</html>
