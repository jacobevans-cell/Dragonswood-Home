<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragonswood V5.3 Character Preview</title><script src="../dragonswood-rpg-v56.js?v=56.32-v5.3.8"></script>
<style>
:root{color-scheme:dark;--gold:#ffe082;--cyan:#65e8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#221450,#050518 70%);color:#fff;font:15px/1.4 Arial}.shell{width:min(1380px,94vw);margin:auto;padding:24px}h1,h2,h3{font-family:Georgia;color:var(--gold)}h1{margin:0;font-size:clamp(30px,5vw,58px)}.notice,.stage,.card{background:#0c0b2de8;border:1px solid #6d559b;border-radius:16px}.notice{padding:14px;margin:16px 0;border-left:6px solid var(--cyan)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.gender{grid-template-columns:repeat(2,minmax(250px,420px));justify-content:center}.card{padding:12px;text-align:center}.card.radiant{border-top:5px solid #ffd85f}.card.shadow{border-top:5px solid #9e69ff}.card>.dw-v5-character{height:220px}.card img{filter:drop-shadow(0 12px 8px #000)}button{border:1px solid var(--gold);border-radius:10px;padding:11px 15px;background:linear-gradient(90deg,#7435c8,#087fa8);color:#fff;font-weight:900;cursor:pointer}button.active{background:linear-gradient(90deg,#e58b19,#fff0a0);color:#17102d;box-shadow:0 0 0 3px #65e8ff,0 0 20px #65e8ff88}.swatch{display:inline-flex;align-items:center;gap:7px}.swatch i{width:22px;height:22px;border:2px solid #fff8;border-radius:50%;background:var(--swatch)}.stage{display:grid;grid-template-columns:minmax(280px,480px) 1fr;gap:18px;padding:18px}.stage>.hero{width:100%;height:480px}.stage>.hero img{filter:drop-shadow(0 12px 8px #000)}.pills,.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pill{padding:5px 10px;border:1px solid #665386;border-radius:999px}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.stage{grid-template-columns:1fr}.stage>.hero{height:330px}}@media(max-width:520px){.grid,.gender{grid-template-columns:1fr}}
</style></head><body><main class="shell"><h1>V5.3 CHARACTER SYSTEM</h1><p>Local no-write preview • all classes • both paths • Levels 1–20 • full state playback • 9 appearance combinations</p><div class="notice" id="notice"></div><section id="chooser"><div class="grid gender" id="grid"></div></section><section class="stage hidden" id="stage"><div id="hero" class="hero" aria-label="Selected V5 adventurer"></div><div><h2 id="name"></h2><div class="pills" id="meta"></div><h3>Skin tone</h3><div class="controls" id="skins"></div><h3>Hair color</h3><div class="controls" id="hairs"></div><h3>Level tier</h3><div class="controls" id="levels"></div><h3>Animation state: <span id="motion">Idle</span></h3><div class="controls" id="states"></div><div class="controls"><button id="chooseAgain">Choose another character</button><button id="legacy">Preview legacy rollback</button></div></div></section></main>
<script>
const R=window.DWRPG,$=id=>document.getElementById(id);let gender='',classId='',affinity='',skin='medium',hair='dark',level=1,currentState='idle';
function previewPack(cls,g,a){return R.resolveV5Character({email:R.v5Config.testerEmail,characterSystemVersion:'v5',characterV5Gender:g,characterV5Affinity:a,characterV5ClassId:cls,characterV5SkinTone:skin,characterV5HairColor:hair,level})}
function preview(cls,g,a,state='happy'){const pack=previewPack(cls,g,a);return R.v5Markup(pack,state,{prefix:'../',version:'56.32-v5.3.8',alt:`${pack.name} preview`})}
function genders(){$('notice').textContent='STEP 1 OF 3 • Choose gender.';$('stage').classList.add('hidden');$('chooser').classList.remove('hidden');$('grid').className='grid gender';$('grid').innerHTML=[['male','Male'],['female','Female']].map(([id,label])=>`<article class="card">${preview('warrior',id,'radiant')}<h2>${label}</h2><button data-gender="${id}">Choose ${label}</button></article>`).join('');document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{gender=b.dataset.gender;classes()})}
function classes(){$('notice').innerHTML=`STEP 2 OF 3 • ${gender==='male'?'Male':'Female'} selected. Choose one of 8 characters. <button id="back">Change gender</button>`;$('grid').className='grid';$('grid').innerHTML=Object.entries(R.classes).flatMap(([cls,c])=>['radiant','shadow'].map(a=>{const family=R.v5Families[cls][gender][a];return`<article class="card ${a}">${preview(cls,gender,a)}<h3>${c.icon} ${family.name}</h3><div>${c.name} • ${a}</div><p>${c.traitText}</p><button data-class="${cls}" data-affinity="${a}">Customize ${family.name}</button></article>`})).join('');$('back').onclick=genders;document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{classId=b.dataset.class;affinity=b.dataset.affinity;show()})}
function profile(){return{email:R.v5Config.testerEmail,characterSystemVersion:'v5',characterV5Gender:gender,characterV5Affinity:affinity,characterV5ClassId:classId,characterV5SkinTone:skin,characterV5HairColor:hair,level}}
function show(){const pack=R.resolveV5Character(profile()),c=R.classes[classId],labels={idle:'Idle',walkLeft:'Walk ←',walkRight:'Walk →',attack:'Attack / Heal',hurt:'Hurt',happy:'Happy',celebrate:'Celebrate'};$('chooser').classList.add('hidden');$('stage').classList.remove('hidden');$('notice').textContent='STEP 3 OF 3 • Test skin, hair, tier, and every separate animation. Legacy data remains untouched.';$('name').textContent=`${c.icon} ${pack.name}`;$('meta').innerHTML=[gender,affinity,c.name,`Level ${level}`,pack.tierName].map(x=>`<span class="pill">${x}</span>`).join('');$('skins').innerHTML=Object.entries(R.v5SkinTones).map(([id,x])=>`<button class="swatch ${skin===id?'active':''}" data-skin="${id}" style="--swatch:${x.color}"><i></i>${x.name}</button>`).join('');$('hairs').innerHTML=Object.entries(R.v5HairColors).map(([id,x])=>`<button class="swatch ${hair===id?'active':''}" data-hair="${id}" style="--swatch:${x.color}"><i></i>${x.name}</button>`).join('');$('levels').innerHTML=[1,5,10,15,20].map(n=>`<button class="${level===n?'active':''}" data-level="${n}">Level ${n}</button>`).join('');$('states').innerHTML=Object.entries(labels).map(([s,label])=>`<button data-state="${s}">${label}</button>`).join('');document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{skin=b.dataset.skin;show()});document.querySelectorAll('[data-hair]').forEach(b=>b.onclick=()=>{hair=b.dataset.hair;show()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);show()});document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{currentState=b.dataset.state;renderHero()});renderHero()}
function renderHero(){const pack=R.resolveV5Character(profile()),labels={idle:'Idle',walkLeft:'Walk ←',walkRight:'Walk →',attack:'Attack / Heal',hurt:'Hurt',happy:'Happy',celebrate:'Celebrate'};R.renderV5Character($('hero'),pack,currentState,{prefix:'../',version:'56.32-v5.3.8',alt:pack.name});$('motion').textContent=labels[currentState]||currentState;document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',b.dataset.state===currentState))}
$('chooseAgain').onclick=genders;$('legacy').onclick=()=>{$('hero').innerHTML='<img src="../assets/rpg/skin-mage-10.png" alt="Legacy adventurer" style="width:100%;height:100%;object-fit:contain">';$('name').textContent='Legacy rollback preview';$('meta').innerHTML='<span class="pill">Old class and equipped appearance restored</span>'};genders();
</script></body></html>
