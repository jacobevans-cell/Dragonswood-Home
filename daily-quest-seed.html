const STALE_DAILY_QUEST_DATES=["2026-11-23","2027-03-08","2027-03-09","2027-03-10","2027-03-11","2027-05-21","2027-05-24","2027-05-25"];
const log=t=>document.getElementById("log").textContent=t;
onAuthStateChanged(auth,u=>{
 const ok=u&&String(u.email||"").toLowerCase()===TEACHER;
 document.getElementById("auth").innerHTML=ok?`<span class="good">✓ Teacher connected: ${u.email}</span>`:`<span class="bad">Sign into the Dragonswood teacher account first.</span>`;
 document.getElementById("seed").disabled=!ok;
});
function phoenixMidnight(dateString,plusDays=0){
 const [y,m,d]=dateString.split("-").map(Number);
 // Phoenix midnight = 07:00 UTC because Arizona stays UTC-7.
 return Timestamp.fromDate(new Date(Date.UTC(y,m-1,d+plusDays,7,0,0)));
}
document.getElementById("seed").onclick=async()=>{
 try{
   log("Preparing 180 calendar-correct quests…");
   let batch=writeBatch(db),ops=0,batches=0;
   for(const lesson of LESSONS){
     const data={...lesson,unlockAt:phoenixMidnight(lesson.date,0),lockAt:phoenixMidnight(lesson.date,1)};
     batch.set(doc(db,"dailyQuests",lesson.date),data);
     ops++;
     if(ops===400){await batch.commit();batches++;batch=writeBatch(db);ops=0;}
   }
   // Remove old v47 dates that fell on breaks / summer / teacher work days.
   for(const staleDate of STALE_DAILY_QUEST_DATES){
     batch.delete(doc(db,"dailyQuests",staleDate));ops++;
   }
   if(ops){await batch.commit();batches++;}
   log(`DONE. Seeded ${LESSONS.length} Daily Quests in ${batches} batch(es).\n\nStudents can only read the quest whose server-time window is currently open.`);
 }catch(err){console.error(err);log("ERROR: "+(err.code||err.message||err));}
};
