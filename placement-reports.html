</style></head><body><main><div class="toolbar"><h1>📊 Math &amp; ELA Placement Reports</h1><button class="action" id="importToggle" type="button">Import i-Ready PDFs</button></div><p class="notice" id="status">Opening private teacher reports…</p><nav class="subject-jumps"><a href="#math-summary">Math Results</a><a href="#reading-summary">Reading Results</a></nav><section class="importer" id="importer"><h2>Import i-Ready Results</h2><p>Select the Math and Reading Inform Results PDFs. They are read in this browser and saved only to the private teacher database.</p><input id="ireadyFiles" type="file" accept="application/pdf" multiple><button class="action" id="importButton" type="button">Review and save results</button><p id="importStatus" aria-live="polite"></p></section><div id="dashboard"></div><div id="reports"></div></main>

function buildReport(row){const grade=Number(row.enrolledGrade)||4,labels={foundation:'Foundation (Grades 2–3)',4:'Grade 4',5:'Grade 5',6:'Grade 6'},levels=['foundation','4','5','6'],number=l=>l==='foundation'?3:Number(l);function subject(subject){const rows=(row.placementResponses||[]).filter(x=>x.subject===subject),summary={};levels.forEach(l=>{const a=rows.filter(x=>x.placementLevel===l),correct=a.filter(x=>x.correct).length;summary[l]={correct,tested:a.length,percent:a.length?Math.round(correct/a.length*100):0}});let placement='foundation';if(summary['4'].percent>=70&&summary.foundation.percent>=60)placement='4';if(summary['5'].percent>=70&&summary['4'].percent>=60)placement='5';if(summary['6'].percent>=70&&summary['5'].percent>=60)placement='6';const delta=number(placement)-grade,at=summary[placement],standards=rows.map(x=>{const relative=Number(x.gradeLevel)-grade;return{...x,relativeLabel:relative===0?'enrolled-grade standard':relative<0?`${Math.abs(relative)} grade level${Math.abs(relative)===1?'':'s'} below enrolled grade`:`${relative} grade level${relative===1?'':'s'} above enrolled grade`,interpretation:x.correct?(relative>0?'advanced evidence demonstrated':relative<0?'prerequisite demonstrated':'grade-level evidence demonstrated'):(relative>0?'advanced standard not yet demonstrated':relative<0?'missing prerequisite evidence':'grade-level support indicated')}});return{subject,placementLabel:labels[placement],relativePlacement:delta===0?'at enrolled grade':delta<0?`${Math.abs(delta)} grade level${Math.abs(delta)===1?'':'s'} behind enrolled grade`:`${delta} grade level${delta===1?'':'s'} ahead of enrolled grade`,confidence:at.tested>=12&&(at.percent<35||at.percent>=85)?'high':at.tested>=10?'moderate':'teacher review recommended',levelSummary:summary,standards}}return{...row,math:subject('MATH'),ela:subject('ELA')}}

function ratingCard(title,dw,ir){const merged=mergedLabel(dw?.placementLabel,ir?.placement);return `<div class="rating-grid"><div class="rating"><h3>Dragonswood ${title}</h3><strong>${esc(dw?.placementLabel||'Not complete')}</strong></div><div class="rating"><h3>i-Ready ${title}</h3><strong>${esc(ir?.placement||'Not imported')}</strong>${ir?.scaleScore?`<p>Scale score ${esc(ir.scaleScore)}</p>`:''}</div><div class="rating"><h3>Merged Average</h3><strong>${esc(merged)}</strong><p>Equal average of both placements</p></div></div>`}

function bandForValue(value,grade){const text=String(value||'');if(!text||/not (?:complete|imported)|waiting/i.test(text))return'missing';const level=text.includes('Foundation')?3:Number(text.match(/[1-6]/)?.[0]);if(!Number.isFinite(level))return'missing';if(level>grade||(level===grade&&!/^Early\b/i.test(text)&&!text.includes('Foundation')))return'above';if(level===grade&&!text.includes('Foundation'))return'on';const gap=grade-level;return gap<=1?'one':gap===2?'two':'three'}
function placementBand(row,subject,source='iready'){const dw=subject==='math'?row.math:row.ela,value=source==='dragonswood'?dw?.placementLabel:source==='merged'?mergedLabel(dw?.placementLabel,row.iready?.[subject]?.placement):row.iready?.[subject]?.placement;return bandForValue(value,Number(row.enrolledGrade)||4)}
function distributionCard(rows,subject,label){const keys=['above','on','one','two','three','missing'],classes=['b-above','b-on','b-one','b-two','b-three','b-missing'],labels=['Mid or Above Grade Level','Early On Grade Level','One Grade Level Below','Two Grade Levels Below','Three or More Grade Levels Below','Not Completed'],series=[['Dragonswood','dragonswood'],['i-Ready','iready'],['Merged Average','merged']],total=rows.length||1;const sourceRow=([name,source])=>{const counts=Object.fromEntries(keys.map(k=>[k,0]));rows.forEach(r=>counts[placementBand(r,subject,source)]++);const width=k=>100*counts[k]/total;return `<div class="source-row"><strong>${name}</strong><div><div class="band-counts">${keys.map(k=>`<span style="width:${width(k)}%">${counts[k]||''}</span>`).join('')}</div><div class="band">${keys.map((k,i)=>`<span class="${classes[i]}" style="width:${width(k)}%"></span>`).join('')}</div></div></div>`};return `<section class="distribution" id="${subject}-summary"><h2>${label} • Overall Placement</h2>${series.map(sourceRow).join('')}<div class="band-labels">${keys.map((k,i)=>`<div>${labels[i]}</div>`).join('')}</div></section>`}

function render(rows){const counts={complete:0,in_progress:0,not_started:0};rows.forEach(r=>counts[r.trackingStatus]++);const alphabetical=[...rows].sort((a,b)=>String(a.studentName).localeCompare(String(b.studentName)));dashboard.innerHTML=`<section class="summary"><div class="metric"><b>${rows.length}</b><small>Enrolled students</small></div><div class="metric"><b>${counts.complete}</b><small>Complete</small></div><div class="metric"><b>${counts.in_progress}</b><small>In progress</small></div><div class="metric"><b>${counts.not_started}</b><small>Not started</small></div></section>${distributionCard(rows,'math','Math')}${comparisonTable(alphabetical,'math','Math')}${distributionCard(rows,'reading','Reading')}${comparisonTable(alphabetical,'reading','Reading')}<nav class="filters" aria-label="Filter benchmark status"><button data-filter="all" aria-pressed="true">Detailed Reports ${rows.length}</button><button data-filter="complete" aria-pressed="false">Complete ${counts.complete}</button><button data-filter="in_progress" aria-pressed="false">In progress ${counts.in_progress}</button><button data-filter="not_started" aria-pressed="false">Not started ${counts.not_started}</button></nav>`;host.innerHTML=rows.length?rows.sort((a,b)=>({in_progress:0,not_started:1,complete:2}[a.trackingStatus]-{in_progress:0,not_started:1,complete:2}[b.trackingStatus])||String(a.studentName).localeCompare(String(b.studentName))).map(studentCard).join(''):'<div class="notice">No enrolled students were found.</div>';document.querySelectorAll('.filters button').forEach(button=>button.addEventListener('click',()=>setFilter(button.dataset.filter)))}

function rowsFromReport(text,subject){const starts=[];for(const student of currentRoster){const first=studentName(student).trim().split(/\s+/)[0],match=new RegExp(`\\b${regexEscape(first)}\\b`,'i').exec(text);if(match)starts.push({index:match.index,student,first})}starts.sort((a,b)=>a.index-b.index);return starts.map((start,i)=>{const chunk=text.slice(start.index,starts[i+1]?.index||text.length),match=chunk.match(/\b((?:Early|Mid|Late)\s+[K1-6]|Grade\s+[K1-6])\s*\((\d+)\)|\b(Not Completed)\b/i);if(!match)return null;const after=match.index+match[0].length,values=[...chunk.slice(after).matchAll(/\b((?:Early|Mid|Late)\s+[K1-6]|Grade\s+[K1-6]|Not Assessed|Surpassed Level|Max Score)\b/gi)].map(x=>x[1]),domainKeys=subject==='math'?['NO','ALG','MS','GEO']:['PA','PH','HFW','VOC','LIT','INFO'],domains={};domainKeys.forEach((key,index)=>domains[key]=values[index]||'—');const growth=chunk.slice(after).match(/\b(\d{1,2})\s+(\d{1,2})\b/);return{studentId:start.student.id,studentName:studentName(start.student),subject,placement:match[1]||match[3],scaleScore:match[2]?Number(match[2]):null,status:match[3]?'not_completed':'complete',domains,typicalGrowth:growth?Number(growth[1]):null,stretchGrowth:growth?Number(growth[2]):null}}).filter(Boolean)}
