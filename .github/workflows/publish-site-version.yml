name: Publish Dragonswood Site Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: dragonswood-site-version
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v6

      - name: Allow the GitHub Pages deployment to finish
        run: sleep 90

      - name: Publish the tiny version signal
        env:
          SITE_SHA: ${{ github.sha }}
          SITE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          version_file="$RUNNER_TEMP/dragonswood-version.json"
          node -e 'const fs=require("fs");fs.writeFileSync(process.argv[1],JSON.stringify({schemaVersion:1,sha:process.env.SITE_SHA,publishedAt:new Date().toISOString(),runId:process.env.SITE_RUN_ID},null,2)+"\n")' "$version_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob="$(git hash-object -w "$version_file")"
          tree="$(printf '100644 blob %s\tdragonswood-version.json\n' "$blob" | git mktree)"
          commit="$(printf 'Publish Dragonswood site version %s\n' "$SITE_SHA" | git commit-tree "$tree")"
          git push --force origin "$commit:refs/heads/automation/site-version"
