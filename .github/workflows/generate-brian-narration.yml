name: Generate Brian Narration

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: Regenerate every clip instead of reusing unchanged MP3s
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dragonswood-brian-narration
  cancel-in-progress: false

jobs:
  generate:
    name: Generate changed Brian recordings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Dragonswood
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Confirm required Azure secrets exist
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ] || [ -z "$AZURE_SPEECH_REGION" ]; then
            echo "Add AZURE_SPEECH_KEY and AZURE_SPEECH_REGION in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check the narration plan
        run: node tools/narration/generate-azure-brian.mjs

      - name: Generate missing or changed Brian MP3s
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate }}
        run: |
          if [ "$FORCE_REGENERATE" = "true" ]; then
            node tools/narration/generate-azure-brian.mjs --generate --force
          else
            node tools/narration/generate-azure-brian.mjs --generate
          fi

      - name: Audit the generated narration
        run: node tools/narration/audit-narration.mjs

      - name: Save generation report with this workflow run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brian-narration-report-${{ github.run_id }}
          path: narration-generation-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated recordings to a review branch
        id: commit
        shell: bash
        run: |
          git add narration-manifest.js narration-manifest.generated.json
          git add -A assets/audio/narration assets/audio/library

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No narration files changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="automation/brian-narration-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Brian narration"
          git push --set-upstream origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open a pull request for listening and review
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          BASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          body=$'Brian narration generated by the manual GitHub Actions workflow.\n\n- Review and listen before merging.\n- Unchanged text was reused by hash.\n- The Azure key was not written to the repository.'
          if gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "Generate Brian narration" --body "$body"; then
            echo "A Brian narration pull request was opened for review." >> "$GITHUB_STEP_SUMMARY"
          else
            compare="https://github.com/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${BRANCH}?expand=1"
            echo "The branch was created, but repository settings blocked automatic pull-request creation." >> "$GITHUB_STEP_SUMMARY"
            echo "Open this comparison to create it manually: $compare" >> "$GITHUB_STEP_SUMMARY"
          fi
